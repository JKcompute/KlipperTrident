#====================================================================
# Nevermore print integration (filament based)
#   PRINT_START  -> _NEVERMORE_PRINT_START FILAMENT={filament_type}
#   PRINT_END / CANCEL_PRINT -> _NEVERMORE_PRINT_END
#
# Filtered filaments: fan forced on for the whole print, then kept on for
# `scrub_time` seconds after the print before going back to automatic.
# Everything else: fan left on the controller's automatic VOC control, so
# it only spins if the sensors actually see VOCs.
#====================================================================
[gcode_macro _NEVERMORE_VARS]
## Upper-case filament types (as sent by the slicer) that get filtered
variable_filter_filaments: ['ABS', 'ASA', 'PC', 'PA', 'PA-CF', 'PA6', 'PA12', 'NYLON', 'PC-ABS', 'ABS-GF', 'ASA-CF', 'HIPS', 'PET-CF']
variable_print_speed: 1.0
## seconds to keep scrubbing after the print ends
variable_scrub_time: 600
## set by _NEVERMORE_PRINT_START, read by _NEVERMORE_PRINT_END
variable_active: False
gcode:

[gcode_macro _NEVERMORE_PRINT_START]
description: Nevermore on/auto based on FILAMENT type
gcode:
    {% if printer.nevermore is defined %}
        {% set v = printer['gcode_macro _NEVERMORE_VARS'] %}
        {% set filament = params.FILAMENT|default('')|string|upper %}
        UPDATE_DELAYED_GCODE ID=_nevermore_scrub_done DURATION=0
        # keep VOC baseline calibration from learning print fumes as "normal"
        NEVERMORE_VOC_CALIBRATION ENABLED=0
        {% if filament in v.filter_filaments %}
            RESPOND TYPE=echo MSG='Nevermore: {filament} -> filtering at {(v.print_speed * 100)|int}%'
            SET_FAN_SPEED FAN=nevermore_fan SPEED={v.print_speed}
            SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=active VALUE=True
        {% else %}
            RESPOND TYPE=echo MSG='Nevermore: {filament} -> automatic (VOC driven)'
            SET_FAN_SPEED FAN=nevermore_fan
            SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=active VALUE=False
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG='Nevermore: not configured, skipping'
    {% endif %}

[gcode_macro _NEVERMORE_PRINT_END]
description: Keep scrubbing after a filtered print, then return to automatic
gcode:
    {% if printer.nevermore is defined %}
        {% set v = printer['gcode_macro _NEVERMORE_VARS'] %}
        {% if v.active %}
            RESPOND TYPE=echo MSG='Nevermore: scrubbing for {v.scrub_time}s'
            UPDATE_DELAYED_GCODE ID=_nevermore_scrub_done DURATION={v.scrub_time}
        {% else %}
            _NEVERMORE_RELEASE
        {% endif %}
    {% endif %}

[gcode_macro _NEVERMORE_RELEASE]
description: Hand the Nevermore back to its own VOC automation
gcode:
    {% if printer.nevermore is defined %}
        SET_FAN_SPEED FAN=nevermore_fan
        NEVERMORE_VOC_CALIBRATION ENABLED=1
        SET_GCODE_VARIABLE MACRO=_NEVERMORE_VARS VARIABLE=active VALUE=False
    {% endif %}

[delayed_gcode _nevermore_scrub_done]
gcode:
    RESPOND TYPE=echo MSG='Nevermore: scrub done, back to automatic'
    _NEVERMORE_RELEASE
