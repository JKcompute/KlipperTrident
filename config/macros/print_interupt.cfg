## Overrides mainsail.cfg's CANCEL_PRINT so a cancel runs the same shutdown as PRINT_END.
## Must be included AFTER [include mainsail.cfg] in printer.cfg, otherwise mainsail's version wins.
[gcode_macro CANCEL_PRINT]
description: Cancel the running print, then retract, cool, park and wipe like PRINT_END
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set resume = printer['gcode_macro RESUME'] %}
  # PAUSE already retracted client.retract, so only top up to PRINT_END's 15mm
  {% set retract = 15.0 - (client.retract|default(0)|float if printer.pause_resume.is_paused else 0) %}

  # state cleanup carried over from mainsail.cfg's CANCEL_PRINT
  {% if resume.restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={resume.restore_idle_timeout}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0

  SAVE_GCODE_STATE NAME=STATE_CANCEL_PRINT
  _END_PRINT_RETRACT_AND_COOL RETRACT={retract}
  # end the job right away so the UI/stats show cancelled, then do the slow cleanup
  CANCEL_PRINT_BASE
  _END_PRINT_PARK_AND_CLEAN
  RESTORE_GCODE_STATE NAME=STATE_CANCEL_PRINT
