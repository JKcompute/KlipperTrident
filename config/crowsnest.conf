#### crowsnest.conf
#### For details on how to configure this to your needs, see:
#### https://github.com/mainsail-crew/crowsnest/blob/v5/README.md
####
#### Port 8080 equals /webcam/?action=[stream/snapshot]

[crowsnest]
log_level: verbose
rollover_on_start: false
no_proxy: false

[cam usb_webcam]
mode: ustreamer
port: 8080
device: /dev/v4l/by-id/usb-16MP_Camera_Mamufacture_16MP_USB_Camera_2022050701-video-index0
resolution: 1920x1080
max_fps: 30
