#====================================================================
# Nevermore Mini - Nevermore Controller firmware on a Waveshare RP2040
# (round GC9A01 screen), connected to the Pi over USB.
#   https://github.com/SanaaHamel/nevermore-controller
#
# Requires the Klipper module (installs nevermore.py into klippy/extras):
#   cd ~ && git clone https://github.com/SanaaHamel/nevermore-controller
#   cd nevermore-controller && ./install-klipper-module.bash
#
# What Klipper gets from this:
#   - fan object `nevermore_fan` (SET_FAN_SPEED FAN=nevermore_fan SPEED=x,
#     omit SPEED to hand control back to the controller's VOC automation)
#   - intake/exhaust temperature, humidity, pressure and VOC index, shown
#     natively in Mainsail's temperature panel/graph
#   - NEVERMORE_* gcode commands (NEVERMORE_STATUS, etc.)
#
# Print-time behaviour lives in macros/nevermore.cfg (per-filament).
#====================================================================
[nevermore]
## USB serial. Use the "-if02" interface (if00 is the console log).
## Find it with: ls -l /dev/serial/by-id/ | grep -i nevermore
serial: /dev/serial/by-id/usb-Nevermore_Filter_waveshare-rp2040-touch-lcd-1.28_343904190872EF42-if02

## The module's built-in "print mode" forces the fan to 100% whenever the
## hotend has a target. We want per-filament control from our macros
## instead, so set the trigger bed target out of reach to disable it.
print_mode_min_bed_target: 999

## Outside of prints the controller keeps its own VOC-driven automatic
## behaviour (fan_policy_* defaults), same as it does standalone today.
