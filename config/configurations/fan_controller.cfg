#====================================================================
# Fan Control
#====================================================================
[fan]
##  Print Cooling Fan - FAN0
pin: nitehawk_sb:gpio6
tachometer_pin: nitehawk_sb:gpio17
tachometer_ppr: 2
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
min_power: 0.10 # formerly known as off_below

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
pin: nitehawk_sb:gpio5
tachometer_pin: nitehawk_sb:gpio16
tachometer_ppr: 2
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

#########################################
# fans from controller
## Fan0 is furthest to left. -> 0, 1, 2, 3
# fan 0: PB7 - either rear case or heater fan, not sure if leviathan has all the IO needed for a heater yet. also not sure if adding rear case fan at all yet. 
# fan 1: PB3 - controller (electronics cooling) (set to 5V)
# fan 2: PF7 - unused (nevermore runs off its own controller, see nevermore.cfg)
# fan 3: PF9 - bed fans
########################################

########## Bed Fans #########
[fan_generic BedFans]
pin: PF9 # Fan3 on controller
#cycle_time: 0.05
kick_start_time: 0.5

# [fan_generic case_fans]
# pin: !PB7
# cycle_time: 0.00004
# hardware_pwm: True
# tachometer_pin: PB8
# tachometer_ppr: 2

# [fan_generic case_fan_2]
# pin: PF5
# tachometer_pin: PF1
# tachometer_ppr: 2

[controller_fan electronics_bay_intake_fans]
pin: !PB7
#   PWM control pin. If the fan runs full speed at SPEED=0 and stops
#   at SPEED=1, invert it with: pin: !PB3
idle_timeout: 120
idle_speed: 0.40
fan_speed: 1.0
standby_speed: 0.70
max_power: 1.0
min_power: 0.0
shutdown_speed: 0.0 # software pwm must be 0 or 1
kick_start_time: 0.5
hardware_pwm: True
cycle_time: 0.00004
heater: heater_bed
 # 25 kHz from https://www.noctua.at/en/support/faqs/microcontroller-guide-pwm-setup-and-rpm-monitoring
#   Default 100Hz software PWM. Try 0.002 if you hear PWM whine or
#   get erratic speed control on a 4-pin fan.
tachometer_pin: PB8
#   ^ enables the MCU's internal pullup. Tach outputs are open-collector,
#   so this is needed unless your board has an external pullup.
tachometer_ppr: 2
#   Pulses per revolution. 2 is standard for PC-style fans.
tachometer_poll_interval: 0.005 # 0.0015 #0.005 try for a6x25
#   30/(tachometer_ppr*max-rpm-of-fan)

[controller_fan electronics_bay_intake_fan_tach_only]
pin: PF5
max_power: 1.0
min_power: 0.0
cycle_time: 0.00004
tachometer_pin: PF1
tachometer_ppr: 2
tachometer_poll_interval: 0.005




